name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create least-privilege roles and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lookbook_owner LOGIN PASSWORD 'owner_dev_pw';
          CREATE ROLE lookbook_app LOGIN PASSWORD 'app_dev_pw';
          CREATE DATABASE lookbook_test OWNER lookbook_owner;
          \connect lookbook_test
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests --select E,F,B --ignore E501,B008
      - run: python -m pytest -q -p no:logging

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (production deps, high severity and up)
        run: npm audit --omit=dev --audit-level=high

# Full LOOKBOOK stack. Copy .env.docker.example to .env and fill it in, then:
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000   S3 storage: http://localhost:8333

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://storage:8333
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    DATABASE_URL: postgresql+psycopg://lookbook_app:${DB_APP_PASSWORD}@postgres:5432/lookbook
    MIGRATION_DATABASE_URL: postgresql+psycopg://lookbook_owner:${DB_OWNER_PASSWORD}@postgres:5432/lookbook
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-lookbook.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS). MinIO no longer publishes community images to Docker
  # Hub. In production, point S3_* at AWS S3 or Cloudflare R2 instead and drop this service.
  storage:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"lookbook","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      WEED_S3_SSE_KEK: ${S3_SSE_KEK}  # 64 hex chars; enables SSE-S3 (AES-256) encryption at rest
    volumes: [storagedata:/data]
    ports: ["8333:8333"]
    healthcheck:
      # 127.0.0.1, not localhost: on Docker Desktop localhost can resolve to ::1 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m scripts.init_storage && python -m scripts.seed_catalog"
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 15s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker -Q tryon,default --concurrency 4 --loglevel INFO
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_STORAGE_ORIGIN: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Automated nightly database backups: 7 daily, 4 weekly and 6 monthly dumps in ./backups.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: lookbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes: ["./backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
